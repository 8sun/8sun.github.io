name: Sync site to docs

on:
  push:
    branches: ["dev"]
    paths:
      - "site/**"
      - ".github/workflows/sync-site-to-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror site -> docs
        run: |
          rm -rf docs
          mkdir -p docs
          rsync -a --delete site/ docs/
          mv google*.html docs/

      - name: Commit docs (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A docs

          git diff --cached --quiet && exit 0

          git commit -m "Sync docs from site"
          git push