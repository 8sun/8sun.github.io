<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}} | {{site_name}}</title>
    <meta name="description" content="{{page_description}}">
    <link rel="canonical" href="{{canonical}}">
    <meta property="og:title" content="{{page_title}}">
    <meta property="og:description" content="{{page_description}}">
    <meta property="og:type" content="{{og_type}}">
    <meta property="og:site_name" content="{{site_name}}">
    <meta property="og:locale" content="{{og_locale}}">
    <meta property="og:image" content="{{og_image}}">
    <meta name="robots" content="{{robots}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{page_title}}">
    <meta name="twitter:description" content="{{page_description}}">
    <meta name="twitter:image" content="{{og_image}}">
    <link rel="stylesheet" href="{{path}}/assets/css/styles.css">
</head>
<body>
<header class="top-banner">
    <p><a href="https://github.com/8sun/static-site-gen">[Powered by 8sun]</a></p>
</header>
<header class="main-header page-header">
    <div class="logo">
        <h1>{{page_title}}</h1>
        <p>{{page_description}}</p>
    </div>
    <nav>
        {{menu}}
    </nav>
</header>
<main>
    <section class="intro">
        {{content}}
        <p class="footer-note">Разделы: {{categories}}</p>
        <p class="footer-note">{{date}}</p>
        <div class="buttons">
            <a href="{{path}}/contact.html" class="button primary">Написать мне</a>
            <a href="{{path}}/about.html" class="button secondary">Об авторе</a>
        </div>
        <p class="footer-note">I have my blog here: <a href="{{canonical}}">My page</a></p>
    </section>
</main>
<script type="application/ld+json">{{structured_data}}</script>
<script src="{{path}}/assets/js/highlight-category.js"></script>
</body>
</html>
